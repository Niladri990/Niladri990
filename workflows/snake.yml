name Generate Snake

on
  schedule
    - cron 0 12   
  workflow_dispatch
  push
    branches [main]

jobs
  build
    runs-on ubuntu-latest
    permissions
      contents write
    steps
      - uses Platanesnk@v3
        id snake-gif
        with
          github_user_name bhupinder759
          outputs 
            distsnake.svg
            distsnake-dark.svgpalette=github-dark

      - uses crazy-maxghaction-github-pages@v4
        with
          target_branch output
          build_dir dist
        env
          GITHUB_TOKEN ${{ secrets.GITHUB_TOKEN }}